name: Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: notesai-cluster
  ECS_SERVICE: notesai-service
  ECS_TASK_DEFINITION: infrastructure/ecs-task-def.json

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Backend Image
        env:
          ECR_REPOSITORY: notesai-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

      - name: Build, tag, and push OCR Image
        env:
          ECR_REPOSITORY: notesai-ocr
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./ocr_service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

      - name: Build, tag, and push AI Image
        env:
          ECR_REPOSITORY: notesai-ai
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./ai_formatter
          docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

      - name: Build, tag, and push PDF Image
        env:
          ECR_REPOSITORY: notesai-pdf
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./pdf_formatter
          docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

      - name: Build, tag, and push Frontend Image
        env:
          ECR_REPOSITORY: notesai-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "VITE_API_BASE=http://${{ vars.EC2_PUBLIC_IP }}:8000" > ./frontend/.env
          echo "VITE_WS_BASE=ws://${{ vars.EC2_PUBLIC_IP }}:8000" >> ./frontend/.env
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

      - name: Update IAM Roles with AWS Account ID
        run: sed -i 's/036230293894/${{ secrets.AWS_ACCOUNT_ID }}/g' ${{ env.ECS_TASK_DEFINITION }}

      - name: Inject secrets into ECS task definition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_S3_BUCKET: notes-ai-storage-036230293894-ap-south-1-an
        run: |
          python3 - <<'EOF'
          import json, os
          with open('infrastructure/ecs-task-def.json') as f:
              task = json.load(f)
          service_containers = ['backend', 'ocr_service', 'ai_formatter', 'pdf_formatter', 'db-init']
          extra_env = [
              {'name': 'OPENAI_API_KEY', 'value': os.environ['OPENAI_API_KEY']},
              {'name': 'AWS_REGION',     'value': 'ap-south-1'},
              {'name': 'AWS_S3_BUCKET',  'value': os.environ['AWS_S3_BUCKET']},
          ]
          for c in task['containerDefinitions']:
              if c['name'] in service_containers:
                  c.setdefault('environment', []).extend(extra_env)
          with open('infrastructure/ecs-task-def.json', 'w') as f:
              json.dump(task, f, indent=2)
          print('Secrets injected successfully')
          EOF

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: backend
          image: ${{ env.ECR_REGISTRY }}/notesai-backend:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
